# Deploys the exact bytes a green CI full lane tested to staging, then runs the staging canary (A§21, T8.D) and, with
# suite=full, the full suite (T8.2). Manual dispatch only. Setup and use: docs/DEPLOY.md. Without the repository secrets
# it lists, the first job fails at once.
# target=pilot runs only the gate, then deploy-pilot.yml with the pilot and Cloudflare secrets (T8.P2): this file is the
# one registered on main, and GitHub runs the dispatched ref's copy of it.
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'The ci.yml run whose web-dist to deploy: a green full lane on a branch head (dispatch lane=full), within its 3-day artifact retention'
        required: true
        type: string
      request_budget:
        description: 'Worker requests the canary may make in this run'
        type: number
        default: 2000
      idle_seconds:
        description: 'Idle before the canary proves a wake (15 or more; SP14)'
        type: number
        default: 20
      suite:
        description: 'canary: the canary legs only. full: then every journey but the @local-only legs, in both engines (T8.2)'
        type: choice
        options: [canary, full]
        default: canary
      suite_request_budget:
        description: 'Worker requests each full-suite shard may make (16 shards)'
        type: number
        default: 5000
      suite_parallel:
        description: 'How many of the 16 full-suite shards run against staging at once (fewer is less load on the shared Worker and D1)'
        type: number
        default: 4
      suite_grep:
        description: 'Only the full-suite legs matching this Playwright --grep (to re-check a staging-only failure); empty is every leg'
        type: string
        default: ''
      target:
        description: 'staging, or pilot for the owner''s notes (deploy-pilot.yml; the request budget and idle are unused)'
        type: choice
        options: [staging, pilot]
        default: staging

permissions:
  contents: read
  actions: read

# One deploy at a time, never cancelled half way. The pilot queues apart from staging's long runs, and apart from
# deploy-pilot.yml's own group, which a caller sharing would deadlock.
concurrency:
  group: ${{ inputs.target == 'pilot' && 'deploy-staging-pilot' || 'deploy-staging' }}
  cancel-in-progress: false

env:
  CI: 'true'
  NO_COLOR: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  # The gate runs this workflow's own scripts (the dispatched commit) before anything from the CI run's commit is
  # checked out or a secret is in reach, and only it emits the sha the later jobs check out (scripts/deploy/run-gate.mjs).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/deploy
      - name: The CI run may deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then echo "::error::ci_run_id must be a run id (digits only)"; exit 1; fi
          dir="$RUNNER_TEMP/gate"
          mkdir -p "$dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$dir/run.json"
          branch=$(node scripts/deploy/run-gate.mjs branch "$dir/run.json")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > "$dir/ref.json" 2> /dev/null || echo null > "$dir/ref.json"
          head=$(jq -r .head_sha "$dir/run.json")
          tip=$(jq -r '.object.sha? // ""' "$dir/ref.json")
          echo null > "$dir/compare.json"
          if [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$head...$tip" > "$dir/compare.json" 2> /dev/null || echo null > "$dir/compare.json"
          fi
          node scripts/deploy/run-gate.mjs sha "$dir/run.json" "$dir/ref.json" "$dir/compare.json" >> "$GITHUB_OUTPUT"
      - name: Every secret is configured
        if: inputs.target == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          STAGING_BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          CANARY_POOL_SECRET: ${{ secrets.CANARY_POOL_SECRET }}
        run: node scripts/deploy/preflight.mjs

  deploy:
    needs: preflight
    if: inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.provenance.outputs.commit }}
      bundleHash: ${{ steps.provenance.outputs.bundleHash }}
      clientHash: ${{ steps.provenance.outputs.clientHash }}
      seedToken: ${{ steps.seed.outputs.token }}
    # Secrets reach only the steps that use them, never the dependency install.
    env:
      RUN_ID: ${{ inputs.ci_run_id }}
      WRANGLER: apps/web/node_modules/wrangler/bin/wrangler.js
    steps:
      - name: Read the CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          # Pages of 30: GitHub answered 502 for every 100-job page of a re-run full lane (run 38671880296).
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=30" --jq '.jobs[]' > "$RUNNER_TEMP/jobs.ndjson"
      # The gated commit: its migrations match the bytes, and its scripts judge them.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - name: The run passed the full lane in both engines
        run: node scripts/deploy/tested-run.mjs "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.ndjson"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The bytes e2e ran on, by artifact: never a rebuild.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact
      - name: Unpack the tested bytes
        id: provenance
        run: |
          tar -xzf "$RUNNER_TEMP/artifact/web-dist.tgz" -C apps/web
          node scripts/provenance.mjs read apps/web/dist >> "$GITHUB_OUTPUT"
      - name: The bytes are the run's head commit
        env:
          COMMIT: ${{ steps.provenance.outputs.commit }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          if [ "$COMMIT" != "$SHA" ]; then echo "::error::web-dist was built from $COMMIT, the run's head is $SHA"; exit 1; fi
      - name: Upload guard
        run: node scripts/deploy/staging-config.mjs guard apps/web/dist
      # A§21: who the token deploys as, before anything is created.
      - name: wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$WRANGLER" whoami
      - name: The staging D1 and R2 exist
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          lookup() { node "$WRANGLER" d1 list --json | jq -r '.[] | select(.name == "moss-multi-staging") | .uuid'; }
          id=$(lookup)
          if [ -z "$id" ]; then
            node "$WRANGLER" d1 create moss-multi-staging
            id=$(lookup)
          fi
          if [ -z "$id" ]; then echo "::error::no D1 database moss-multi-staging"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if ! node "$WRANGLER" r2 bucket info moss-multi-staging-assets > /dev/null 2>&1; then
            node "$WRANGLER" r2 bucket create moss-multi-staging-assets
          fi
      - name: The staging config over the tested bytes
        env:
          D1_ID: ${{ steps.d1.outputs.id }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: node scripts/deploy/staging-config.mjs write apps/web/dist --d1-id "$D1_ID" --url "$STAGING_URL"
      # Before the deploy, so the new bytes never meet an old schema. wrangler applies them in file-name order and the
      # upload guard checked that order against the drizzle journal.
      - name: D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$WRANGLER" d1 migrations apply moss-multi-staging --remote --config apps/web/dist/server/wrangler.json
      # A§21: earlier suites' per-run principals (mm-*@example.invalid, over 2 h old; never the canary pool or the demo
      # accounts) go before a full suite, at most PRUNE_CAP a run, counted first (scripts/deploy/prune.mjs). Their docs
      # cascade with them. Only counts are printed; the selection stays on the runner.
      - name: Prune earlier suite principals
        if: inputs.suite == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          dir="$RUNNER_TEMP/prune"
          mkdir -p "$dir"
          d1() { node "$WRANGLER" d1 execute moss-multi-staging --remote --config apps/web/dist/server/wrangler.json "$@"; }
          d1 --json --command "$(node scripts/deploy/prune.mjs count-sql)" > "$dir/count.json"
          d1 --json --command "$(node scripts/deploy/prune.mjs select-sql)" > "$dir/select.json"
          node scripts/deploy/prune.mjs plan "$dir/count.json" "$dir/select.json" "$dir/delete.sql"
          if [ -s "$dir/delete.sql" ]; then d1 --yes --file "$dir/delete.sql" > /dev/null; echo "pruned"; fi
      # A§21: nothing else reclaims what the full suite creates, so it stops at a cap and the owner decides past it. The
      # prune shrinks only D1, so the Worker's DocDOs and PrincipalDOs are counted from Cloudflare's list; only counts print.
      - name: Staging has room for a full suite
        if: inputs.suite == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node "$WRANGLER" d1 execute moss-multi-staging --remote --json --config apps/web/dist/server/wrangler.json \
            --command "SELECT (SELECT count(*) FROM docs) AS docs, (SELECT count(*) FROM user) AS users" > "$RUNNER_TEMP/growth.json"
          node scripts/deploy/growth.mjs objects "$RUNNER_TEMP/objects.json"
          node scripts/deploy/growth.mjs check "$RUNNER_TEMP/growth.json" "$RUNNER_TEMP/objects.json"
      # Staging allows 30 sign-ups a day per address (auth.ts), far fewer than the suite's fresh accounts: this run's
      # are written into D1 as a sign-up would, one password per run derived from the pool secret, only its hash in
      # the SQL, which stays on the runner (scripts/deploy/seed.mjs). The prune takes them on a later run.
      - name: Seed this run's suite principals
        id: seed
        if: inputs.suite == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CANARY_POOL_SECRET: ${{ secrets.CANARY_POOL_SECRET }}
        run: |
          umask 077
          token=$(node scripts/deploy/seed.mjs token "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          sql="$RUNNER_TEMP/seed.sql"
          trap 'rm -f "$sql"' EXIT
          node scripts/deploy/seed.mjs sql "$sql" --token "$token"
          node "$WRANGLER" d1 execute moss-multi-staging --remote --yes --config apps/web/dist/server/wrangler.json --file "$sql" > /dev/null
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy the tested bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          COMMIT: ${{ steps.provenance.outputs.commit }}
        run: |
          umask 077
          secrets="$RUNNER_TEMP/staging-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          node -e 'process.stdout.write(JSON.stringify({ BETTER_AUTH_SECRET: process.env.STAGING_BETTER_AUTH_SECRET }))' > "$secrets"
          node "$WRANGLER" deploy --config apps/web/dist/server/wrangler.json --secrets-file "$secrets" --message "ci run $RUN_ID, commit $COMMIT"
      - name: Staging serves the tested bytes and no test hook
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          COMMIT: ${{ steps.provenance.outputs.commit }}
          BUNDLE: ${{ steps.provenance.outputs.bundleHash }}
          CLIENT: ${{ steps.provenance.outputs.clientHash }}
        run: node scripts/deploy/assert-deployed.mjs --base-url "$STAGING_URL" --expect-commit "$COMMIT" --expect-bundle "$BUNDLE" --expect-client "$CLIENT" --wait 600

  # j00-shell, the j01 setup legs and j04's @staging leg on staging (A§21, SP14): the fixed principal pool, this
  # run's request budget, and a wake after natural idle proven through the owner-only instance route.
  canary:
    needs: [preflight, deploy]
    if: inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canary state
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          COMMIT: ${{ needs.deploy.outputs.commit }}
          BUNDLE: ${{ needs.deploy.outputs.bundleHash }}
          CLIENT: ${{ needs.deploy.outputs.clientHash }}
          BUDGET: ${{ inputs.request_budget }}
          IDLE: ${{ inputs.idle_seconds }}
        run: |
          node scripts/deploy/canary-state.mjs --out "$RUNNER_TEMP/canary/state.json" --base-url "$STAGING_URL" \
            --commit "$COMMIT" --bundle "$BUNDLE" --client "$CLIENT" --budget "$BUDGET" --idle-ms "$((IDLE * 1000))" \
            --run-id "staging-${GITHUB_RUN_ID}"
          echo "STACK_STATE=$RUNNER_TEMP/canary/state.json" >> "$GITHUB_ENV"
      - name: The canary legs
        working-directory: e2e
        env:
          CANARY_POOL_SECRET: ${{ secrets.CANARY_POOL_SECRET }}
          RUN_ID: staging-${{ github.run_id }}
        run: pnpm exec playwright test --project=canary
      # The log and artifact are public: off loopback the config prints titles, statuses and durations, plus a failed
      # test's fixed-format facts (canary-reporter.mjs, docs/DEPLOY.md), and the artifact is the request count and each
      # test's title, status and duration. Never a trace, report, error text or URL, which can carry the pooled
      # sessions' cookies or bearer links.
      - name: A credential-free summary
        if: always()
        run: |
          mkdir -p e2e/canary-artifacts
          cp "$RUNNER_TEMP/canary/requests.json" e2e/canary-artifacts/requests.json || true
          cat e2e/canary-artifacts/requests.json || true
          node scripts/deploy/canary-artifacts.mjs summary e2e/test-results/results.json e2e/canary-artifacts/summary.json
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-canary-${{ github.run_attempt }}
          path: |
            e2e/canary-artifacts/requests.json
            e2e/canary-artifacts/summary.json
          retention-days: 7
          if-no-files-found: ignore

  # SP9's Worker telemetry (T8.2): j11-media's near-cap probe alone, against the deployed bytes, under a tail filtered on
  # the header its uploads carry, recording each upload's outcome, status, CPU and wall time (scripts/deploy/
  # tail-summary.mjs). It runs before the suite and the error tail, because Cloudflare's tails interfere: unfiltered, a
  # tail sampled the near-cap upload away (run 39145040057), and beside a filtered tail an unfiltered one saw only the
  # filtered one's events (runs 39116654098, 39130102453). The Cloudflare token reaches only the step that starts the
  # tail. It signs in to slot c6's last principals, which shard c6 does not reach.
  sp9:
    name: SP9 near-cap probe
    needs: [preflight, deploy, canary]
    if: inputs.target == 'staging' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host --init
    env:
      WRANGLER: apps/web/node_modules/wrangler/bin/wrangler.js
      RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}-sp9
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe state
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          COMMIT: ${{ needs.deploy.outputs.commit }}
          BUNDLE: ${{ needs.deploy.outputs.bundleHash }}
          CLIENT: ${{ needs.deploy.outputs.clientHash }}
          BUDGET: ${{ inputs.suite_request_budget }}
          IDLE: ${{ inputs.idle_seconds }}
          SEED_TOKEN: ${{ needs.deploy.outputs.seedToken }}
        run: |
          node scripts/deploy/canary-state.mjs --out "$RUNNER_TEMP/canary/state.json" --base-url "$STAGING_URL" \
            --commit "$COMMIT" --bundle "$BUNDLE" --client "$CLIENT" --budget "$BUDGET" --idle-ms "$((IDLE * 1000))" \
            --run-id "$RUN_ID" --principals seeded --seed-token "$SEED_TOKEN" --seed-slots c6
          echo "STACK_STATE=$RUNNER_TEMP/canary/state.json" >> "$GITHUB_ENV"
          # Claim c6's first 280 principals here, so the probe signs in to the last ones.
          mkdir -p "$RUNNER_TEMP/canary/seed-claims"
          for k in $(seq 0 279); do : > "$RUNNER_TEMP/canary/seed-claims/$k"; done
      - name: Suite password
        env:
          CANARY_POOL_SECRET: ${{ secrets.CANARY_POOL_SECRET }}
          SEED_TOKEN: ${{ needs.deploy.outputs.seedToken }}
        run: |
          if [ "$SEED_TOKEN" != "s${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::the seeded principals are attempt ${SEED_TOKEN##*-}'s; re-run all jobs, not only the failed ones"; exit 1
          fi
          password=$(node scripts/deploy/seed.mjs password --token "$SEED_TOKEN")
          echo "::add-mask::$password"
          echo "MOSS_SUITE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: The probe leg under its tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BROWSER: chromium
          SHARD: '6'
          E2E_GLOBAL_TIMEOUT_MIN: '15'
          MOSS_MULTI_NO_OPEN: '1'
        run: |
          mkdir -p e2e/canary-artifacts
          probe=e2e/canary-artifacts/sp9-probe.json
          node scripts/deploy/tail-summary.mjs probe "$probe" -- node "$WRANGLER" tail moss-multi-staging --format json --header x-sp9-probe &
          pid=$!
          # Only the tail holds the Cloudflare token; the journeys never see it.
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          # wrangler prints nothing until it connects; give the session time to open before the first upload.
          sleep 20
          status=0
          (cd e2e && pnpm exec playwright test --project=staging-chromium --grep "SP9 near-cap probe") || status=$?
          # The tail delivers an event after its request ends; give the last upload's a moment to arrive.
          sleep 15
          kill -TERM "$pid" 2> /dev/null || true
          wait "$pid" || true
          cat "$probe"
          node scripts/deploy/tail-summary.mjs check-probe "$probe" || status=1
          exit "$status"
      - name: A credential-free summary
        if: always()
        run: node scripts/deploy/canary-artifacts.mjs summary e2e/test-results/results.json e2e/canary-artifacts/summary.json
      - name: Upload the probe telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-sp9-${{ github.run_attempt }}
          path: |
            e2e/canary-artifacts/sp9-probe.json
            e2e/canary-artifacts/summary.json
          retention-days: 7
          if-no-files-found: ignore

  # What the Worker and its Durable Objects failed at while the suite ran (T8.2): one unfiltered `wrangler tail`, its
  # failures reduced to counts under fixed names (scripts/deploy/tail-summary.mjs), restarted when it ends on its own.
  # The tail's own output is never printed: it holds URLs, headers and log lines. It starts after the sp9 job's tail
  # ended and stops once every suite shard finished, or the canary failed; a tail that ends before that fails the job.
  tail:
    needs: [preflight, deploy, sp9]
    if: always() && inputs.target == 'staging' && inputs.suite == 'full' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    # The 16 shards at suite_parallel 4 run in four waves of up to 80 minutes each.
    timeout-minutes: 350
    env:
      WRANGLER: apps/web/node_modules/wrangler/bin/wrangler.js
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tail staging while the suite runs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p e2e/canary-artifacts
          out=e2e/canary-artifacts/tail-summary.json
          node scripts/deploy/tail-summary.mjs run "$out" -- node "$WRANGLER" tail moss-multi-staging --format json &
          pid=$!
          early=''
          while true; do
            sleep 60
            jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=30" --jq '.jobs[] | [.name, .status, (.conclusion // "")] | @tsv' || true)
            if grep -qP '^canary\tcompleted\t(?!success)' <<< "$jobs"; then break; fi
            done_shards=$(grep -cP '^suite \(.*\tcompleted\t' <<< "$jobs" || true)
            if [ "$done_shards" -ge 16 ]; then break; fi
            if ! kill -0 "$pid" 2> /dev/null; then early=1; break; fi
          done
          kill -TERM "$pid" 2> /dev/null || true
          wait "$pid" || true
          cat "$out"
          if jq -e '(.limitMinutes | length) > 0' "$out" > /dev/null; then
            echo "::warning::an isolate passed its memory or CPU limit during the suite, resetting the Durable Objects it held: see limitMinutes in tail-summary.json"
          fi
          if jq -e '.overload > 0' "$out" > /dev/null; then
            echo "::warning::the tail sampled under load: the summary may miss events (overload in tail-summary.json)"
          fi
          if [ -n "$early" ]; then
            echo "::error::the tail ended before the suite finished"
            exit 1
          fi
      - name: Upload the tail summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-tail-${{ github.run_attempt }}
          path: |
            e2e/canary-artifacts/tail-summary.json
          retention-days: 7
          if-no-files-found: ignore

  # The full suite on staging (A§21, T8.2), after a green canary: every journey but the @local-only legs (test hooks or
  # stack control), in both engines, sharded eight ways. Per-run @example.invalid principals the deploy seeded, each
  # shard signing in to its own slots with the run's derived password (never the pool secret); each shard has its own
  # request budget; the wake is j04's owner-route leg. The canary's log and artifact policy holds.
  suite:
    name: suite (${{ matrix.browser }}, ${{ matrix.shard }}/8)
    needs: [preflight, deploy, canary, sp9]
    if: always() && inputs.target == 'staging' && inputs.suite == 'full' && needs.canary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.suite_parallel) }}
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}-${{ matrix.shard }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # j18 runs the moss-multi CLI against the Worker; the deployed bytes are never rebuilt.
      - name: Build the CLI
        run: pnpm --filter @moss-multi/cli build
      - name: Suite state
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          COMMIT: ${{ needs.deploy.outputs.commit }}
          BUNDLE: ${{ needs.deploy.outputs.bundleHash }}
          CLIENT: ${{ needs.deploy.outputs.clientHash }}
          BUDGET: ${{ inputs.suite_request_budget }}
          IDLE: ${{ inputs.idle_seconds }}
          SEED_TOKEN: ${{ needs.deploy.outputs.seedToken }}
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
        run: |
          node scripts/deploy/canary-state.mjs --out "$RUNNER_TEMP/canary/state.json" --base-url "$STAGING_URL" \
            --commit "$COMMIT" --bundle "$BUNDLE" --client "$CLIENT" --budget "$BUDGET" --idle-ms "$((IDLE * 1000))" \
            --run-id "$RUN_ID" --principals seeded --seed-token "$SEED_TOKEN" --seed-slots "${BROWSER:0:1}$SHARD"
          echo "STACK_STATE=$RUNNER_TEMP/canary/state.json" >> "$GITHUB_ENV"
      # The seeded accounts' password, masked before it reaches the environment; the pool secret stays in this step.
      # A re-run of only the failed shards would sign in to slots its first attempt used: re-run every job instead.
      - name: Suite password
        env:
          CANARY_POOL_SECRET: ${{ secrets.CANARY_POOL_SECRET }}
          SEED_TOKEN: ${{ needs.deploy.outputs.seedToken }}
        run: |
          if [ "$SEED_TOKEN" != "s${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::the seeded principals are attempt ${SEED_TOKEN##*-}'s; re-run all jobs, not only the failed ones"; exit 1
          fi
          password=$(node scripts/deploy/seed.mjs password --token "$SEED_TOKEN")
          echo "::add-mask::$password"
          echo "MOSS_SUITE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: The journeys
        working-directory: e2e
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
          E2E_GLOBAL_TIMEOUT_MIN: '70'
          MOSS_MULTI_NO_OPEN: '1'
          GREP: ${{ inputs.suite_grep }}
        run: |
          # The sp9 job ran the near-cap probe already; the 95 MiB upload is not repeated.
          args=(--project=staging-"$BROWSER" --shard="$SHARD/8" --grep-invert "SP9 near-cap probe")
          if [ -n "$GREP" ]; then args+=(--grep "$GREP" --pass-with-no-tests); echo "Only the legs matching --grep $GREP"; fi
          pnpm exec playwright test "${args[@]}"
      - name: A credential-free summary
        if: always()
        run: |
          mkdir -p e2e/canary-artifacts
          cp "$RUNNER_TEMP/canary/requests.json" e2e/canary-artifacts/requests.json || true
          cat e2e/canary-artifacts/requests.json || true
          node scripts/deploy/canary-artifacts.mjs summary e2e/test-results/results.json e2e/canary-artifacts/summary.json
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-suite-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            e2e/canary-artifacts/requests.json
            e2e/canary-artifacts/summary.json
          retention-days: 7
          if-no-files-found: ignore

  # The pilot, after the same gate: its own gate, secret check, deploy and read-only smoke. It is passed only the pilot
  # secrets and the shared Cloudflare ones, and never the staging or canary ones.
  pilot:
    needs: preflight
    if: inputs.target == 'pilot'
    uses: ./.github/workflows/deploy-pilot.yml
    with:
      ci_run_id: ${{ inputs.ci_run_id }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PILOT_URL: ${{ secrets.PILOT_URL }}
      PILOT_BETTER_AUTH_SECRET: ${{ secrets.PILOT_BETTER_AUTH_SECRET }}
      PILOT_ALLOWED_EMAILS: ${{ secrets.PILOT_ALLOWED_EMAILS }}
