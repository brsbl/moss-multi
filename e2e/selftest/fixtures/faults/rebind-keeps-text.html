<!-- Not a fault (the positive control): after typing, the body rebinds (unbound and empty for 1.5 s) and comes back
     live with the typed text. The selftest asks for the rebind once it has typed: a timer rebinds in the middle of a
     stall, and the rest of the typing then goes nowhere. -->
<script>
  const body = document.querySelector('[data-body-binding]');
  window.rebind = () => {
    const text = body.querySelector('p').textContent;
    // Focus leaves the field as it unbinds, so only invariant 7 can flag this (an unbound field holding focus is 9's).
    body.blur();
    body.setAttribute('contenteditable', 'false');
    body.setAttribute('data-body-binding', 'unbound');
    body.querySelector('p').textContent = '';
    document.documentElement.setAttribute('data-unbound', 'true');
    setTimeout(() => {
      body.querySelector('p').textContent = text;
      body.setAttribute('data-body-binding', 'live');
      body.setAttribute('contenteditable', 'true');
    }, 1500);
  };
</script>
