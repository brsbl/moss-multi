<!-- Invariant 7: every third typed character swaps with the one before it ('hello' becomes 'hlelo'). -->
<script>
  let typed = 0;
  document.addEventListener('input', (event) => {
    if (event.inputType !== 'insertText' || !event.target.matches('[data-body-binding]')) return;
    typed += 1;
    if (typed % 3 !== 0) return;
    const selection = getSelection();
    const node = selection.anchorNode;
    const offset = selection.anchorOffset;
    if (!node || node.nodeType !== Node.TEXT_NODE || offset < 2) return;
    const text = node.data;
    node.data = text.slice(0, offset - 2) + text[offset - 1] + text[offset - 2] + text.slice(offset);
    selection.collapse(node, offset);
  });
</script>
