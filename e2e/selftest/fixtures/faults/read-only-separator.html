<!-- Invariant 9: a read-only body's tab bar keeps a focusable resize separator; only the tabs themselves are exempt. -->
<script>
  document.querySelector('aside').insertAdjacentHTML('beforeend', `
    <div data-body-binding="readonly" contenteditable="false">
      <div role="tablist">
        <div role="tab" aria-selected="true" tabindex="0">First</div>
        <div role="separator" aria-orientation="vertical" tabindex="-1"></div>
        <div role="tab" aria-selected="false" tabindex="-1">Second</div>
      </div>
      <p>Read-only text.</p>
    </div>`);
</script>
