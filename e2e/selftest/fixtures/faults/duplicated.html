<!-- Invariant 7: an echo applies the typed text twice ('WORD' becomes 'WORDWORD'). -->
<script>
  let pending = '';
  let timer = 0;
  document.addEventListener('input', (event) => {
    if (event.inputType !== 'insertText' || !event.target.matches('[data-body-binding]')) return;
    pending += event.data ?? '';
    clearTimeout(timer);
    timer = setTimeout(() => {
      event.target.querySelector('p').append(pending);
      pending = '';
      document.documentElement.setAttribute('data-echoed', 'true');
    }, 200);
  });
</script>
